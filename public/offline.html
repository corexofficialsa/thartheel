<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#152b54" />
    <title>You're offline — Mirqath Quran Academy</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #faf8f4; color: #1f2430; text-align: center; }
      @media (prefers-color-scheme: dark) { body { background: #16140f; color: #efece6; } p { color: #b9b3a8 !important; } }
      img { width: 72px; height: auto; }
      h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 1.9rem; margin: 20px 0 8px; }
      p { max-width: 34ch; margin: 0 auto; color: #6b6558; line-height: 1.5; }
      a { display: inline-block; margin-top: 24px; padding: 10px 20px; border-radius: 10px; background: #152b54; color: #fff; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="Mirqath Quran Academy" />
      <h1>You're offline</h1>
      <p>Check your internet connection, then try again. Your work is saved on the server and will be there when you're back.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
